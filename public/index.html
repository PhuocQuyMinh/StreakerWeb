<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streak Tracker</title>
</head>

<body>
    <h1>Streak Tracker</h1>

    <div id="auth-section">
        <h2>Login / Register</h2>
        <input type="email" id="email" placeholder="Enter your email">
        <input type="password" id="password" placeholder="Password (min 6 characters)">
        <button id="login-btn">Login</button>
        <button id="register-btn">Register</button>
    </div>

    <div id="app-section" style="display: none;">
        <h2>Welcome, <span id="user-email"></span>!</h2>
        <button id="logout-btn">Logout</button>
        <hr>

        <div id="streak-summary-container"
            style="background-color: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="margin-top: 0;">Your Streaks🔥</h3>
            <p id="daily-progress" style="margin-top: 0; margin-bottom: 10px; font-weight: bold; color: #555;">
            </p>
            <ul id="streak-summary-list" style="margin-bottom: 0;">
            </ul>
        </div>

        <div id="create-goal-form" style="background: #f4f4f4; padding: 15px; margin-top: 20px;">
            <h3>Create a New Goal</h3>
            <input type="text" id="goal-title" placeholder="Goal Name (e.g., Morning Routine)">
            <br><br>
            <input type="text" id="goal-subtasks"
                placeholder="Sub-tasks (comma separated, e.g., Drink water, Read 10 pages)" style="width: 300px;">
            <br><br>
            <button id="save-goal-btn">Save Goal</button>
        </div>

        <div id="goals-container" style="margin-top: 30px;">
            <h3>Your Active Goals</h3>
            <div id="goals-list">
            </div>
        </div>
    </div>

    <div id="history-modal"
        style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
        <div
            style="background-color: white; margin: 10% auto; padding: 20px; border-radius: 8px; width: 80%; max-width: 400px; position: relative; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
            <span id="close-modal"
                style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #555;">&times;</span>
            <h3 id="modal-title" style="margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px;">History
            </h3>
            <div id="modal-content" style="max-height: 300px; overflow-y: auto;">
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
